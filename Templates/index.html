<html lang="en">
<head>
    <title>Metoda</title>
    <link rel="stylesheet" href="/static/styles/index_style.css">
</head>

<header class="main-header">
    <div class="header-logo">
        <a href="/events"><img src="/static/img/home.svg" alt="home"></a>
    </div>
    <nav class="header-nav">
        <a href="#">О нас</a>
        <a href="/result">Итоги</a>
        <a href="/AllCity/"> Города</a>
        <a href="#">Войти</a>
    </nav>
</header>

<main>
    <div class="search-section">
        <form action="/events" method="GET" class="search-form">
            <input type="text" name="query" placeholder="Найди свой город..." value="{{ .query }}">
            <button type="submit"><img src="/static/img/search.svg" alt="search"></button>
        </form>
    </div>

    <div class="events-grid">
        {{ range .city }}
        <div class="event-card">
            <div class="card-image">
                <img src="{{ .Img }}" alt="{{ .Title }}">
            </div>
            <div class="card-content">
                <h3>{{ .Title }}</h3>
                <p class="city-label">Город: {{ .City.Title }}</p>
                <a href="/events/{{ .ID }}" class="vote-button">Голосовать</a>
            </div>
        </div>
        {{ end }}
    </div>
    <a href="/events/create" class="vote-button">Создай своё мероприятие</a>
</main>
